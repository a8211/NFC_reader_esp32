name: Build ESP32 firmware

on:
  push:
    branches: 
      - main
    paths:
      - "NFC_reader_esp32.ino"
  workflow_dispatch:

permissions:
  contents: write 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.3

    - name: Install Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        sudo mv bin/arduino-cli /usr/local/bin/

    - name: Setup Arduino CLI
      run: |
        arduino-cli config init
        arduino-cli core update-index
        arduino-cli core install esp32:esp32

    - name: Install libraries
      run: |
        arduino-cli lib update-index
        arduino-cli lib install "RTClib"
        arduino-cli lib install "ESP8266 and ESP32 OLED driver for SSD1306 displays"
        arduino-cli lib install "SD"
        arduino-cli lib install "ArduinoJson"
        arduino-cli lib install "NTPClient"
        cd $HOME/Arduino/libraries
        git clone --recursive https://github.com/Seeed-Studio/PN532.git
        git clone --recursive https://github.com/don/NDEF.git


    - name: Compile sketch
      run: |
        mkdir -p build
        arduino-cli compile --fqbn esp32:esp32:esp32 ./NFC_reader_esp32.ino --output-dir build

    - name: Copy firmware to folder
      run: |
        mkdir -p firmware
        cp build/NFC_reader_esp32.ino.bin firmware/

    - name: Commit firmware to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add firmware/
        git commit -m "Add compiled firmware [skip ci]" || echo "Nothing to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Firmware
        body: "Automatycznie wygenerowane firmware ESP32"
        files: build/NFC_reader_esp32.ino.merged.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
